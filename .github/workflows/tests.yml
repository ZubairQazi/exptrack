name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: |
          python -m venv /tmp/exptrack-wheel
          /tmp/exptrack-wheel/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/exptrack-wheel/bin/exptrack --help
          /tmp/exptrack-wheel/bin/python -m exptrack --help
